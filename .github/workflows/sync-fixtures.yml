name: FPL Fixture Sync

on:
  # Runs by itself - checks the site every 15 minutes and applies
  # whatever results/fixtures are due, with no one needing to click
  # "Run workflow". Manual runs (below) still work exactly as before,
  # e.g. to preview before trusting the automation, or to force a run.
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: Choose whether to preview or execute the import
        required: true
        default: preview
        type: choice
        options:
          - preview
          - execute

permissions:
  contents: read

# Prevents two runs from overlapping if a run ever takes longer than
# 15 minutes (Playwright + several site round trips) - the next
# scheduled run waits instead of racing the one still in progress.
concurrency:
  group: fpl-fixture-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest -q

      - name: Run FPL Bot
        env:
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

          ADMIN_LOGIN_PATH: ${{ secrets.ADMIN_LOGIN_PATH }}
          ADMIN_PAGE_PATH: ${{ secrets.ADMIN_PAGE_PATH }}

          BOT_API_PATH: ${{ secrets.BOT_API_PATH }}
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}

          SITE_TIMEZONE: ${{ secrets.SITE_TIMEZONE }}

          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}

          HEADLESS: "true"

          # Keep the existing dangerous-site protection behavior.
          ALLOW_UNSAFE_SITE: "true"

          # A scheduled run has no human to answer a "mode" prompt, so
          # it always executes for real. A manual run still respects
          # whatever you pick in the "Run workflow" dropdown.
          IMPORT_CONFIRM: ${{ (github.event_name == 'schedule' || inputs.mode == 'execute') && 'true' || 'false' }}

        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "execute" ]; then
            python -m bot.main --execute
          else
            python -m bot.main
          fi

      - name: Upload bot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-fixture-bot-results
          path: |
            sql/*.sql
            reports/*
          if-no-files-found: ignore