name: FPL Fixture Sync

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: Choose whether to preview or execute the import
        required: true
        default: preview
        type: choice
        options:
          - preview
          - execute

permissions:
  contents: read

concurrency:
  group: fpl-fixture-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest -q

      - name: Run FPL Bot
        env:
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          WHATSAPP_GAP_HOURS: ${{ secrets.WHATSAPP_GAP_HOURS }}

          LEADERBOARD_PAGE_PATH: ${{ secrets.LEADERBOARD_PAGE_PATH }}
          LEADERBOARD_GW_PARAM: ${{ secrets.LEADERBOARD_GW_PARAM }}
          LEADERBOARD_TABLE_SELECTOR: ${{ secrets.LEADERBOARD_TABLE_SELECTOR }}

          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}

          ADMIN_LOGIN_PATH: ${{ secrets.ADMIN_LOGIN_PATH }}
          ADMIN_PAGE_PATH: ${{ secrets.ADMIN_PAGE_PATH }}

          BOT_API_PATH: ${{ secrets.BOT_API_PATH }}
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}

          SITE_TIMEZONE: ${{ secrets.SITE_TIMEZONE }}

          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}

          HEADLESS: "true"

          ALLOW_UNSAFE_SITE: "true"

          IMPORT_CONFIRM: ${{ (github.event_name == 'schedule' || inputs.mode == 'execute') && 'true' || 'false' }}

        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "execute" ]; then
            python -m bot.main --execute
          else
            python -m bot.main
          fi

      - name: Upload bot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-fixture-bot-results
          path: |
            sql/*.sql
            reports/*
          if-no-files-found: ignore